# CI for Digits-Recognition.
#
# On every push to main and on every pull request (not for documentation-only changes):
#   1. The C++ program is built with CMake, GCC and OpenCV on Linux.
#      OpenCV is built from source with the three modules the program uses
#      (core, imgproc, imgcodecs) and cached: the apt package libopencv-dev
#      installs hundreds of dependencies (video, GUI, GDAL) and takes too long.
#   2. The saved weights (weights.dat) must recognize all 42 images in testing_images.
#   3. Training from random weights must finish: all 70 training images recognized correctly.
#   4. The HOG demonstration (hog.py) runs without errors (plots are not shown).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:              # documentation only: nothing to build or test
      - "**.md"
      - "images/**"
      - "Course project.pdf"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
      - "Course project.pdf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: Linux - build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30        # stop a stuck job instead of waiting up to 6 hours
    env:
      OPENCV_VERSION: "4.10.0"
      OPENCV_DIR: ${{ github.workspace }}/../opencv-install

    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENCV_DIR }}
          key: opencv-${{ env.OPENCV_VERSION }}-core-imgproc-imgcodecs-ubuntu-24.04

      - name: Build OpenCV (core, imgproc, imgcodecs)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OPENCV_VERSION" https://github.com/opencv/opencv.git ../opencv
          cmake -S ../opencv -B ../opencv-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$OPENCV_DIR" \
            -DBUILD_LIST=core,imgproc,imgcodecs -DBUILD_SHARED_LIBS=OFF -DBUILD_ZLIB=ON \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_OPENCL=OFF -DWITH_LAPACK=OFF -DWITH_EIGEN=OFF \
            -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_OPENJPEG=OFF \
            -DWITH_JASPER=OFF -DWITH_OPENEXR=OFF -DWITH_AVIF=OFF -DWITH_IMGCODEC_HDR=OFF \
            -DWITH_IMGCODEC_SUNRASTER=OFF -DWITH_IMGCODEC_PXM=OFF -DWITH_IMGCODEC_PFM=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_V4L=OFF -DWITH_GTK=OFF -DWITH_QT=OFF \
            -DWITH_1394=OFF -DWITH_ADE=OFF -DWITH_PROTOBUF=OFF -DWITH_TBB=OFF -DWITH_VA=OFF
          cmake --build ../opencv-build --parallel 4
          cmake --install ../opencv-build

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="$OPENCV_DIR/lib/cmake/opencv4"
          cmake --build build

      # menu: 7 - load weights, 8 - test testing_images, 0 - exit
      - name: Test the saved weights
        run: |
          printf '7\n8\n0\n' | ./build/digits_recognition | tee test.log
          grep -q "Images: 42, errors: 0" test.log

      # menu: 5 - train on training_images, 8 - test testing_images, 0 - exit
      - name: Train from random weights
        run: |
          printf '5\n8\n0\n' | ./build/digits_recognition | tee train.log
          grep -q "End of images set training" train.log

  hog-demo:
    name: Python - HOG demonstration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scipy scikit-image matplotlib

      - name: Run hog.py
        env:
          MPLBACKEND: Agg      # no display on the runner
        run: python hog.py
